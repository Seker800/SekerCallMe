name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate shell syntax
        run: bash -n scripts/*.sh client/*.sh
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
