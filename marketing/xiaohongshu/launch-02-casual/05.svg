<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440"><defs>
  <pattern id="dots" width="42" height="42" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="2" fill="#D8D1C6" opacity=".42"/></pattern>
  <filter id="smallShadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#413B32" flood-opacity=".10"/></filter>
</defs><rect width="1080" height="1440" fill="#F2EEE4"/><rect width="1080" height="1440" fill="url(#dots)"/>
  <g transform="translate(72 72) rotate(-1)"><rect width="264" height="62" rx="18" fill="#FFFFFF" stroke="#242329" stroke-width="3"/><text x="132" y="41" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="22" font-weight="650" fill="#242329" text-anchor="middle">自己用着方便</text></g>
  <text x="72" y="240" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="78" font-weight="760" fill="#242329" text-anchor="start">所以顺手</text>
  <text x="72" y="336" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="92" font-weight="780" fill="#242329" text-anchor="start">开源出来了</text>
  <path d="M72 372 q112 10 224 1 t224 3" fill="none" stroke="#705CF6" stroke-width="9" stroke-linecap="round"/>
  <g transform="translate(72 470) rotate(-1)">
    <rect width="936" height="320" rx="42" fill="#FFFFFF" stroke="#242329" stroke-width="4" filter="url(#smallShadow)"/>
    <text x="48" y="82" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="24" font-weight="650" fill="#77737E" text-anchor="start">GitHub</text>
    <text x="48" y="150" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="41" font-weight="760" fill="#242329" text-anchor="start">Seker800 / LetAgentSpeak</text>
    <text x="48" y="210" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="27" font-weight="550" fill="#77737E" text-anchor="start">或者直接搜：Let Agent Speak</text>
    <rect x="48" y="244" width="180" height="44" rx="22" fill="#E9E3FF"/><text x="138" y="274" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="20" font-weight="700" fill="#705CF6" text-anchor="middle">MIT 开源</text>
  </g>
  <g transform="translate(72 870)">
    <path d="M0 0h936" stroke="#D8D1C6" stroke-width="4" stroke-linecap="round"/>
    <text x="0" y="86" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="34" font-weight="650" fill="#242329" text-anchor="start">我现在主要拿 Mac + Codex 用。</text>
    <text x="0" y="150" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="30" font-weight="520" fill="#77737E" text-anchor="start">Claude Code、OpenClaw 这些也能接。</text>
    <text x="0" y="245" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="34" font-weight="700" fill="#705CF6" text-anchor="start">想试的话，把地址丢给你的 Agent 就行。</text>
  </g>
  <g transform="translate(72 1250)"><rect width="430" height="86" rx="28" fill="#242329"/><text x="215" y="55" font-family="PingFang SC, Hiragino Sans GB, sans-serif" font-size="27" font-weight="650" fill="#FFFFFF" text-anchor="middle">拿去用吧，就这样。</text></g>
</svg>