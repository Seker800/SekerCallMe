="170" rx="9" fill="#0EA5E9"/><circle cx="86" cy="85" r="38" fill="#0EA5E920"/><text x="86" y="95" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="22" font-weight="780" fill="#0EA5E9" text-anchor="middle" >03</text><text x="154" y="73" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="34" font-weight="760" fill="#17171C" text-anchor="start" >局域网通知</text><text x="154" y="118" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="22" font-weight="500" fill="#706C78" text-anchor="start" >把结果可靠地送到 Mac</text><path d="M468 174v38" stroke="#17171C" stroke-width="4" stroke-linecap="round"/><path d="m456 200 12 13 12-13" fill="none" stroke="#17171C" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><g transform="translate(0 654)"><rect width="936" height="170" rx="36" fill="#FFFFFF" filter="url(#shadow)"/><rect width="18" height="170" rx="9" fill="#F97316"/><circle cx="86" cy="85" r="38" fill="#F9731620"/><text x="86" y="95" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="22" font-weight="780" fill="#F97316" text-anchor="middle" >04</text><text x="154" y="73" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="34" font-weight="760" fill="#17171C" text-anchor="start" >本地语音</text><text x="154" y="118" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="22" font-weight="500" fill="#706C78" text-anchor="start" >Qwen3-TTS · macOS say 兜底</text></g>
