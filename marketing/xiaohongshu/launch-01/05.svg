  <text x="72" y="355" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="26" font-weight="500" fill="#706C78" text-anchor="start" >各组件保持独立，因此语音、消息和 Agent 都能替换。</text>
