<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8B5CF6"/><stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="darkFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0D0D13" stop-opacity=".90"/>
      <stop offset=".5" stop-color="#0D0D13" stop-opacity=".30"/>
      <stop offset="1" stop-color="#0D0D13" stop-opacity=".93"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#111827" flood-opacity=".16"/>
    </filter>
    <clipPath id="roundPhoto"><rect x="72" y="176" width="936" height="430" rx="36"/></clipPath>
  </defs><rect width="1080" height="1440" fill="#18131F"/>
  <g transform="translate(72 72)"><rect width="290" height="52" rx="26" fill="#3A3845"/><text x="145" y="35" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="22" font-weight="650" fill="#FFFFFF" text-anchor="middle" >听得见的结果</text></g>
  <text x="72" y="205" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="76" font-weight="780" fill="#FFFFFF" text-anchor="start" >做完会说</text>
  <text x="72" y="298" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="76" font-weight="780" fill="#FFFFFF" text-anchor="start" >卡住也会说</text>
  <text x="72" y="360" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="27" font-weight="500" fill="#B9B3C5" text-anchor="start" >不是泛泛提醒，而是一句话告诉我发生了什么。</text>
  <g transform="translate(72 450)" filter="url(#shadow)">
    <rect width="936" height="326" rx="44" fill="#FFFFFF"/>
    <circle cx="88" cy="88" r="42" fill="url(#brand)"/>
    <path d="M69 85h12l15-14v34L81 91H69Z" fill="#fff"/><path d="M101 75c12 10 12 22 0 32" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
    <text x="156" y="75" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="23" font-weight="700" fill="#8B5CF6" text-anchor="start" >任务完成</text>
    <text x="64" y="174" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="40" font-weight="760" fill="#17171C" text-anchor="start" >“代码检查已经完成，</text>
    <text x="64" y="226" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="40" font-weight="760" fill="#17171C" text-anchor="start" >所有测试通过。”</text>
    <text x="64" y="282" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="23" font-weight="500" fill="#706C78" text-anchor="start" >我只需要知道结果，不必再回来确认。</text>
  </g>
  <g transform="translate(72 824)" filter="url(#shadow)">
    <rect width="936" height="326" rx="44" fill="#2A2132" stroke="#5E4B69" stroke-width="2"/>
    <circle cx="88" cy="88" r="42" fill="#F97316"/>
    <text x="88" y="102" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="42" font-weight="800" fill="#FFFFFF" text-anchor="middle" >!</text>
    <text x="156" y="75" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="23" font-weight="700" fill="#FDBA74" text-anchor="start" >需要操作</text>
    <text x="64" y="174" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="40" font-weight="760" fill="#FFFFFF" text-anchor="start" >“部署等待权限确认，</text>
    <text x="64" y="226" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="40" font-weight="760" fill="#FFFFFF" text-anchor="start" >请回到电脑批准。”</text>
    <text x="64" y="282" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="23" font-weight="500" fill="#B9B3C5" text-anchor="start" >需要我时，把下一步直接说清楚。</text>
  </g>
  <g transform="translate(72 1210)"><g transform="translate(0 0)"><rect width="228" height="64" rx="32" fill="url(#brand)" stroke="none" stroke-width="2"/><text x="114" y="41" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="24" font-weight="650" fill="#FFFFFF" text-anchor="middle" >完成</text></g><g transform="translate(248 0)"><rect width="270" height="64" rx="32" fill="#FFFFFF" stroke="#E9E4DA" stroke-width="2"/><text x="135" y="41" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="24" font-weight="650" fill="#17171C" text-anchor="middle" >阻塞</text></g><g transform="translate(538 0)"><rect width="326" height="64" rx="32" fill="#FFFFFF" stroke="#E9E4DA" stroke-width="2"/><text x="163" y="41" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="24" font-weight="650" fill="#17171C" text-anchor="middle" >需要我</text></g></g>
  <text x="72" y="1372" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="18" font-weight="650" fill="#CFC9DC" text-anchor="start" >LET AGENT SPEAK · 开源项目</text><text x="1008" y="1372" font-family="PingFang SC, Hiragino Sans GB, Arial, sans-serif" font-size="18" font-weight="650" fill="#CFC9DC" text-anchor="end" >04 / 08</text>
</svg>